<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8ed">
<title>流れる絵譜</title>
<style>
:root{--bg:#fff8ed;--panel:#fff;--ink:#222;--muted:#6d6359;--line:#d9c9b7;--accent:#e7832d;--red:#d83b35}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{padding:14px 10px 6px;text-align:center}h1{margin:0;font-size:clamp(24px,4vw,38px)}.sub{margin-top:5px;color:var(--muted);font-weight:700}
.controls{position:sticky;top:0;z-index:30;background:#fff8edef;backdrop-filter:blur(9px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
button,select,input{font:inherit}button,.fileLabel{border:2px solid #8c745c;background:#fff;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer;min-height:44px}button.primary,.fileLabel.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.active{background:var(--red);border-color:var(--red);color:#fff}.fileLabel input{display:none}.group{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:6px 9px;font-weight:700}.time{font-size:20px;font-weight:900;min-width:115px;text-align:center}
audio{display:block;width:min(980px,95vw);margin:8px auto}.progress{width:min(1180px,97vw);height:11px;background:#eadfd3;margin:auto;border-radius:99px;overflow:hidden}.progressBar{height:100%;width:0;background:var(--accent)}.status{width:min(1180px,97vw);margin:8px auto;text-align:center;font-weight:800}
.board{width:min(1180px,97vw);margin:0 auto 18px;background:#fff;border:3px solid var(--line);border-radius:22px;padding:12px}.empty{padding:28px;text-align:center;color:var(--muted);font-weight:800}.lane{display:grid;grid-template-columns:155px 1fr;margin:9px 0}.lane.hidden{display:none}.label{min-height:150px;border:2px solid #8d7762;border-right:0;border-radius:16px 0 0 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:4px}.ico{font-size:42px}.nm{font-size:20px;font-weight:900}.mini{font-size:12px;color:var(--muted);font-weight:700}.editLane{padding:5px 8px;min-height:34px;font-size:13px}.track{position:relative;height:150px;overflow:hidden;border:2px solid #8d7762;border-radius:0 16px 16px 0;background:repeating-linear-gradient(to right,#fff 0,#fff calc(12.5% - 1px),#eee5da calc(12.5% - 1px),#eee5da 12.5%);touch-action:pan-y}.track.editing{box-shadow:inset 0 0 0 5px #ffd2b5;cursor:crosshair}.target{position:absolute;left:105px;top:0;bottom:0;width:5px;background:var(--red);z-index:8}.target:before{content:"ここ！";position:absolute;top:4px;left:-22px;background:var(--red);color:#fff;border-radius:9px;padding:4px 7px;font-size:12px;font-weight:900}.note{position:absolute;top:50%;transform:translateY(-50%);width:72px;height:72px;border:4px solid #68584b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;text-align:center;z-index:5;box-shadow:0 4px 8px #0002;user-select:none;padding:5px;touch-action:none}.note.current{border-color:var(--red);box-shadow:0 0 0 10px #ffdada,0 4px 8px #0002;transform:translateY(-50%) scale(1.08)}body.deleteMode .note{cursor:pointer;outline:6px solid #ffd2d2}.offset{display:grid;grid-template-columns:auto 1fr 58px;align-items:center;gap:5px;width:100%;font-size:11px}.offset input[type=range]{width:100%}.offset output{font-variant-numeric:tabular-nums}.performance{width:min(1180px,97vw);margin:8px auto 12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}.performance .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.chooserBackdrop{position:fixed;inset:0;background:#0007;z-index:100;display:grid;place-items:center;padding:16px}.chooserBackdrop[hidden]{display:none}.chooser{width:min(700px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:20px;padding:18px}.chooser h2{margin-top:0}.instGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.instChoice{display:grid;place-items:center;gap:4px;padding:14px 8px}.instChoice span:first-child{font-size:34px}.instChoice.selected{background:#fff0df;border-color:var(--accent)}.chooserActions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.saveHint{font-size:13px;color:var(--muted);text-align:center}
body.single .lane:not(.hidden){grid-template-columns:190px 1fr}body.single .lane:not(.hidden) .label,body.single .lane:not(.hidden) .track{min-height:220px;height:220px}body.single .lane:not(.hidden) .ico{font-size:56px}body.single .lane:not(.hidden) .nm{font-size:27px}body.single .lane:not(.hidden) .target{left:140px}
@media(max-width:760px){.lane{grid-template-columns:105px 1fr}.ico{font-size:31px}.nm{font-size:15px}.target{left:72px}.offset{grid-template-columns:1fr 48px}.offset b{grid-column:1/-1}body.single .lane:not(.hidden){grid-template-columns:120px 1fr}body.single .lane:not(.hidden) .target{left:90px}}
@media(prefers-reduced-motion:reduce){.note{transition:none!important}}
</style>
</head>
<body>
<header><h1>流れる絵譜</h1><div class="sub">赤い「ここ！」に絵が来たら鳴らします。</div></header>
<div class="controls">
<button class="primary" id="playBtn">▶ 再生</button><button id="pauseBtn">⏸ 一時停止</button><button id="backBtn">↶ 5秒</button><button id="resetBtn">↺ 最初</button>
<label class="fileLabel">🎵 曲を選ぶ<input id="audioFile" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac"></label>
<button id="instrumentBtn">🎺 楽器を選ぶ</button><button id="deleteBtn">🗑 削除モード</button><button id="restoreBtn">↩ 絵譜を戻す</button>
<button id="saveBtn">💾 保存</button><button id="loadBtn">📂 保存を読込</button>
<div class="group">表示<select id="modeSelect"><option value="all">全部</option></select></div>
<div class="group">速さ<select id="rateSelect"><option value=".75">0.75倍</option><option value=".9">0.9倍</option><option value="1" selected>1.0倍</option><option value="1.1">1.1倍</option><option value="1.25">1.25倍</option><option value="1.5">1.5倍</option></select></div>
<div class="time"><span id="nowText">0:00</span> / <span id="durText">0:00</span></div>
</div>
<audio id="audio" controls preload="metadata" playsinline></audio><div class="progress"><div id="progressBar" class="progressBar"></div></div><div id="statusText" class="status">まず「曲を選ぶ」と「楽器を選ぶ」を使います。</div>
<section class="performance"><div class="row"><b>演奏用：</b><span id="performanceButtons"></span></div></section>
<section id="board" class="board"><div class="empty">「楽器を選ぶ」から使う楽器を選んでください。</div></section>
<div class="saveHint">保存すると、選んだ楽器・絵譜・位置調整・曲をこのブラウザーに保存します。</div>

<div id="chooserBackdrop" class="chooserBackdrop" hidden><div class="chooser" role="dialog" aria-modal="true" aria-labelledby="chooserTitle"><h2 id="chooserTitle">使う楽器を選ぶ</h2><div id="instGrid" class="instGrid"></div><div class="chooserActions"><button id="chooserCancel">キャンセル</button><button class="primary" id="chooserDone">決定</button></div></div></div>

<script>
'use strict';
const INSTRUMENTS=[
{id:'taiko',name:'太鼓',icon:'🥁',color:'#ef9a62'},{id:'bell',name:'鈴',icon:'🔔',color:'#f3cf55'},{id:'tamb',name:'タンバリン',icon:'⭕',color:'#7fc8b5'},
{id:'snare',name:'小太鼓',icon:'🥁',color:'#f0a878'},{id:'bass',name:'大太鼓',icon:'🪘',color:'#db8b62'},{id:'cymbal',name:'シンバル',icon:'◉',color:'#f2d472'},
{id:'triangle',name:'トライアングル',icon:'△',color:'#dce9ee'},{id:'castanet',name:'カスタネット',icon:'◒',color:'#de8d72'},{id:'maracas',name:'マラカス',icon:'🪇',color:'#a5d6a7'},
{id:'xylophone',name:'木琴',icon:'🎼',color:'#b9c9f5'},{id:'tonechime',name:'トーンチャイム',icon:'🔔',color:'#d8c6ef'},{id:'recorder',name:'リコーダー',icon:'🪈',color:'#b8e0dc'}];
const BASE_PATTERNS=[
[{t:0,text:'タン'},{t:1,text:'タタ'},{t:2,text:'タン'},{t:3,text:'ウン'}],
[{t:0,text:'シャン'},{t:1,text:'シャン'},{t:2,text:'シャン'},{t:3,text:'ウン'}],
[{t:0,text:'シャラ'},{t:1,text:'シャラ'},{t:2,text:'タン'},{t:3,text:'ウン'}]
];
const PX_PER_SEC=145,TARGET_X=105,START_X=480;
const state={selected:['taiko','bell','tamb'],lanes:{},editId:null,deleteMode:false,mode:'all',audioName:''};
const $=id=>document.getElementById(id),audio=$('audio');
function fmt(s){if(!Number.isFinite(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function defaultNotes(index){const p=BASE_PATTERNS[index%3],out=[];for(let block=0;block<24;block++){for(const n of p)out.push({id:crypto.randomUUID?.()||Math.random().toString(36),time:block*4+n.t,text:n.text});}return out}
function ensureLane(id,index){if(!state.lanes[id])state.lanes[id]={offset:0,notes:defaultNotes(index)}}
function inst(id){return INSTRUMENTS.find(x=>x.id===id)}
function renderChooser(){const g=$('instGrid');g.innerHTML='';INSTRUMENTS.forEach(i=>{const b=document.createElement('button');b.type='button';b.className='instChoice'+(state.selected.includes(i.id)?' selected':'');b.innerHTML='<span>'+i.icon+'</span><b>'+i.name+'</b>';b.onclick=()=>{const n=state.selected.indexOf(i.id);n>=0?state.selected.splice(n,1):state.selected.push(i.id);renderChooser()};g.appendChild(b)})}
function openChooser(){renderChooser();$('chooserBackdrop').hidden=false}
function closeChooser(){$('chooserBackdrop').hidden=true}
function renderModeOptions(){const s=$('modeSelect'),old=s.value;s.innerHTML='<option value="all">全部</option>';state.selected.forEach(id=>{const i=inst(id),o=document.createElement('option');o.value=id;o.textContent=i.icon+' '+i.name+'だけ';s.appendChild(o)});s.value=[...s.options].some(o=>o.value===old)?old:'all';state.mode=s.value}
function renderPerformanceButtons(){const r=$('performanceButtons');r.innerHTML='';state.selected.forEach(id=>{const i=inst(id),b=document.createElement('button');b.textContent=i.icon+' '+i.name+'だけ';b.onclick=()=>{$('modeSelect').value=id;state.mode=id;renderVisibility()};r.appendChild(b)})}
function renderBoard(){const board=$('board');board.innerHTML='';if(!state.selected.length){board.innerHTML='<div class="empty">楽器を1つ以上選んでください。</div>';return}state.selected.forEach((id,index)=>{ensureLane(id,index);const i=inst(id),lane=state.lanes[id];const el=document.createElement('div');el.className='lane';el.id='lane-'+id;el.innerHTML='<div class="label" style="background:'+i.color+'33"><div class="ico">'+i.icon+'</div><div class="nm">'+i.name+'</div><button class="editLane" data-edit="'+id+'">✋ 編集</button><div class="offset"><b>位置</b><input type="range" min="-4" max="4" step=".05" value="'+lane.offset+'" data-offset="'+id+'"><output>'+lane.offset.toFixed(2)+'</output></div></div><div class="track" id="track-'+id+'"><div class="target"></div></div>';board.appendChild(el);const track=el.querySelector('.track');lane.notes.forEach(n=>track.appendChild(noteEl(id,n,i.color)));el.querySelector('[data-edit]').onclick=()=>{state.editId=state.editId===id?null:id;renderBoard();renderVisibility();$('statusText').textContent=state.editId?i.name+'を編集中：丸をドラッグ。空いている所をタップで追加。':'編集を終了しました。'};const rng=el.querySelector('[data-offset]'),out=el.querySelector('output');rng.oninput=()=>{lane.offset=Number(rng.value);out.textContent=lane.offset.toFixed(2);updatePositions()};track.addEventListener('click',e=>{if(state.editId!==id||e.target!==track)return;const rect=track.getBoundingClientRect();const x=e.clientX-rect.left;const t=Math.max(0,(x-START_X)/PX_PER_SEC+(audio.currentTime||0)-lane.offset);lane.notes.push({id:crypto.randomUUID?.()||Math.random().toString(36),time:t,text:'タン'});renderBoard();renderVisibility();updatePositions()})});renderModeOptions();renderPerformanceButtons();renderVisibility();updatePositions()}
function noteEl(id,n,color){const d=document.createElement('div');d.className='note';d.dataset.note=n.id;d.dataset.lane=id;d.style.background=color;d.textContent=n.text;d.addEventListener('click',e=>{e.stopPropagation();if(state.deleteMode){state.lanes[id].notes=state.lanes[id].notes.filter(x=>x.id!==n.id);renderBoard();renderVisibility();return}});let sx=0,st=0,drag=false;d.addEventListener('pointerdown',e=>{if(state.editId!==id||state.deleteMode)return;drag=true;sx=e.clientX;st=n.time;d.setPointerCapture(e.pointerId)});d.addEventListener('pointermove',e=>{if(!drag)return;n.time=Math.max(0,st+(e.clientX-sx)/PX_PER_SEC);updatePositions()});d.addEventListener('pointerup',e=>{drag=false;try{d.releasePointerCapture(e.pointerId)}catch{}});return d}
function renderVisibility(){document.body.classList.toggle('single',state.mode!=='all');document.querySelectorAll('.lane').forEach(l=>l.classList.toggle('hidden',state.mode!=='all'&&l.id!=='lane-'+state.mode));document.querySelectorAll('.track').forEach(t=>t.classList.toggle('editing',state.editId&&t.id==='track-'+state.editId))}
function updatePositions(){const now=audio.currentTime||0;state.selected.forEach(id=>{const lane=state.lanes[id];if(!lane)return;document.querySelectorAll('#track-'+id+' .note').forEach(el=>{const n=lane.notes.find(x=>x.id===el.dataset.note);if(!n)return;const x=START_X+(n.time+lane.offset-now)*PX_PER_SEC;el.style.left=x+'px';const hit=Math.abs(x-TARGET_X)<22;el.classList.toggle('current',hit)})});$('nowText').textContent=fmt(now);$('durText').textContent=fmt(audio.duration);$('progressBar').style.width=(Number.isFinite(audio.duration)&&audio.duration>0?now/audio.duration*100:0)+'%';if(!audio.paused)requestAnimationFrame(updatePositions)}
async function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('flow-score-simple',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('save'))r.result.createObjectStore('save')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbPut(key,val){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction('save','readwrite');tx.objectStore('save').put(val,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function dbGet(key){const db=await dbOpen();return new Promise((res,rej)=>{const r=db.transaction('save').objectStore('save').get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function saveAll(){const data={selected:state.selected,lanes:state.lanes,rate:audio.playbackRate,audioName:state.audioName};await dbPut('score',data);if(audio._file)await dbPut('audio',audio._file);$('statusText').textContent='保存しました。次に開いたときも読み込めます。'}
async function loadAll(){const data=await dbGet('score');if(!data)return $('statusText').textContent='保存された内容はありません。';state.selected=Array.isArray(data.selected)?data.selected:[];state.lanes=data.lanes||{};audio.playbackRate=Number(data.rate||1);$('rateSelect').value=String(audio.playbackRate);const f=await dbGet('audio');if(f){setAudioFile(f)}renderBoard();$('statusText').textContent='保存内容を読み込みました。'}
function setAudioFile(file){if(audio._url)URL.revokeObjectURL(audio._url);audio._file=file;state.audioName=file.name||'曲';audio._url=URL.createObjectURL(file);audio.src=audio._url;audio.load();$('statusText').textContent='曲「'+state.audioName+'」を読み込みました。'}
$('audioFile').onchange=e=>{const f=e.target.files?.[0];if(f)setAudioFile(f);e.target.value=''};$('instrumentBtn').onclick=openChooser;$('chooserCancel').onclick=closeChooser;$('chooserDone').onclick=()=>{state.selected.forEach((id,i)=>ensureLane(id,i));closeChooser();renderBoard()};$('playBtn').onclick=async()=>{try{await audio.play();updatePositions()}catch{$('statusText').textContent='先に曲を選んでください。'}};$('pauseBtn').onclick=()=>audio.pause();$('backBtn').onclick=()=>{audio.currentTime=Math.max(0,(audio.currentTime||0)-5);updatePositions()};$('resetBtn').onclick=()=>{audio.currentTime=0;updatePositions()};$('deleteBtn').onclick=()=>{state.deleteMode=!state.deleteMode;document.body.classList.toggle('deleteMode',state.deleteMode);$('deleteBtn').classList.toggle('active',state.deleteMode);$('statusText').textContent=state.deleteMode?'消したい丸をタップします。':'削除モードを終了しました。'};$('restoreBtn').onclick=()=>{if(!confirm('絵譜を最初の並びに戻しますか？'))return;state.lanes={};state.selected.forEach((id,i)=>ensureLane(id,i));renderBoard()};$('saveBtn').onclick=()=>saveAll().catch(()=>{$('statusText').textContent='保存できませんでした。'});$('loadBtn').onclick=()=>loadAll().catch(()=>{$('statusText').textContent='保存内容を読み込めませんでした。'});$('modeSelect').onchange=e=>{state.mode=e.target.value;renderVisibility()};$('rateSelect').onchange=e=>audio.playbackRate=Number(e.target.value);audio.addEventListener('timeupdate',updatePositions);audio.addEventListener('loadedmetadata',updatePositions);audio.addEventListener('ended',updatePositions);
state.selected.forEach((id,i)=>ensureLane(id,i));renderBoard();
loadAll().catch(()=>{});
</script>
</body>
</html>
