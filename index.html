<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>デジタル絵譜</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#faf7ea;color:#3c321e;margin:0;display:grid;place-items:center;min-height:100vh}#msg{padding:24px;text-align:center;font-weight:700}
</style>
</head>
<body>
<div id="msg">デジタル絵譜を読み込んでいます…</div>
<script>
(async()=>{
  try{
    const b64=(await (await fetch('./embedded/app.gz.b64?rev=20260910a',{cache:'no-store'})).text()).trim();
    const bin=atob(b64),bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    console.error(e);
    document.getElementById('msg').innerHTML='読み込みに失敗しました。<br>ページを再読み込みしてください。';
  }
})();
</script>
</body>
</html>
