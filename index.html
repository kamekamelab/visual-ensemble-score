<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>デジタル絵譜</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#faf7ea;color:#3c321e;margin:0;display:grid;place-items:center;min-height:100vh}#msg{padding:24px;text-align:center;font-weight:700}</style>
</head>
<body>
<div id="msg">デジタル絵譜を読み込んでいます…</div>
<script>
(async()=>{
 try{
  const urls=['./embedded/gz0.txt?rev=20260910b','./embedded/gz1.txt?rev=20260910b','./embedded/gz2.txt?rev=20260910b'];
  const parts=await Promise.all(urls.map(async u=>(await (await fetch(u,{cache:'no-store'})).text()).trim()));
  const b64=parts.join(''),bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();
  // 教材書き出し時は、実際の音源Blobサイズをメタデータに記録する。
  html=html.replace("  validateProject(project);\\n  if(!mediaBlob || mediaBlob.size!==project.media?.size) throw Error('教材に含める音源がありません。');\\n  const meta=new TextEncoder().encode(JSON.stringify(project));","  if(!mediaBlob || !mediaBlob.size) throw Error('教材に含める音源がありません。');\\n  const snapshot=structuredClone(project);\\n  if(!snapshot.media)throw Error('教材に含める音源がありません。');\\n  snapshot.media.size=mediaBlob.size;\\n  validateProject(snapshot);\\n  const meta=new TextEncoder().encode(JSON.stringify(snapshot));");
  // 旧版で記録サイズがずれた教材でも、実際にファイル内に残っている音源を優先して復元する。
  html=html.replace("  if(project.media?.size!==file.size-12-len)throw Error('教材内の音源が不足しています。');\\n  return {project,blob:file.slice(12+len,file.size,project.media.type)};","  const mediaStart=12+len,actualSize=file.size-mediaStart;\\n  if(!project.media||actualSize<=0)throw Error('教材内に音源データがありません。');\\n  if(project.media.size!==actualSize)project.media.size=actualSize;\\n  return {project,blob:file.slice(mediaStart,file.size,project.media.type)};");
  const expose=`window.__scoreApp={INSTRUMENTS,addPart,edited,score,remember,message,getProject:()=>project,getViewPart:()=>viewPart,showPart:(id)=>{viewPart=id;const s=$('partView');if(s)s.value=id;score.mount(id);renderControls();},hasMedia:()=>!!mediaBlob,syncUnlock:async()=>{if(!mediaBlob)throw Error('先に教材・音源を読み込んでください。');pause();const wasMuted=media.muted;media.muted=true;try{await media.play();media.pause();seek(0);}finally{media.muted=wasMuted;}},syncScheduleStart:(delayMs,pos=0)=>{pause();seek(pos);clearTimeout(window.__scoreSyncTimer);window.__scoreSyncTimer=setTimeout(async()=>{try{await media.play();startDraw();}catch(e){message('この端末で再生を開始できませんでした。もう一度「準備OK」を押してください。');}},Math.max(0,delayMs||0));},syncPause:()=>{clearTimeout(window.__scoreSyncTimer);pause();},syncSeek:(t)=>{clearTimeout(window.__scoreSyncTimer);seek(Number(t)||0);},enterPerformance:()=>setPerform(true),getSyncTime:()=>position(),getSyncRate:()=>Number(project.view.rate)||1,syncCorrect:(target)=>{if(!mediaBlob)return 0;const now=position(),diff=Number(target)-now,base=Number(project.view.rate)||1,ad=Math.abs(diff);if(ad>.35){seek(Number(target));media.playbackRate=base;}else if(ad>.07){media.playbackRate=base*(diff>0?1.01:.99);}else{media.playbackRate=base;}return diff;},syncRestoreRate:()=>{if(mediaBlob)media.playbackRate=Number(project.view.rate)||1;}};\ninit();\n\nreturn {};`;
  html=html.replace('init();\n\nreturn {};',expose);
  html=html.replace('</body></html>','<script src="./face-addon.js?rev=20260927d"><\/script><script src="./sync-addon.js?rev=20260927d"><\/script></body></html>');
  document.open();document.write(html);document.close();
 }catch(e){console.error(e);document.getElementById('msg').innerHTML='読み込みに失敗しました。<br>ページを再読み込みしてください。';}
})();
</script>
</body>
</html>
