<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#fff8ed;--ink:#222;--muted:#6d6359;--line:#d9c9b7;--accent:#e7832d;--red:#d83b35}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}header{padding:14px 10px 6px;text-align:center}h1{margin:0;font-size:clamp(24px,4vw,38px)}.sub{margin-top:5px;color:var(--muted);font-weight:700}
.controls{position:sticky;top:0;z-index:30;background:#fff8edef;backdrop-filter:blur(9px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;border-bottom:1px solid var(--line)}button,select,input{font:inherit}button,.fileLabel{border:2px solid #8c745c;background:#fff;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer;min-height:44px}button.primary,.fileLabel.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.active{background:var(--red);border-color:var(--red);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.fileLabel input{display:none}.group{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:6px 9px;font-weight:700}.time{font-size:20px;font-weight:900;min-width:115px;text-align:center}
.tempoBox,.audioBox{width:min(980px,95vw);margin:8px auto;background:#fff;border:2px solid #e4c5a4;border-radius:14px;padding:10px}.tempoBox{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}.tempoBox strong{font-size:20px}.tempoBox button{min-width:54px}.tempoBox input{width:86px;padding:7px;border:2px solid var(--line);border-radius:10px;text-align:center;font-weight:900}.audioName{text-align:center;font-weight:900;margin-bottom:6px}audio{display:block;width:100%}.status{width:min(1180px,97vw);margin:8px auto;text-align:center;font-weight:800}.tip{width:min(1180px,97vw);margin:8px auto;background:#fff3df;border:1px solid #e9cda8;border-radius:12px;padding:9px;text-align:center;font-weight:700;color:#604d3c}
.board{width:min(1180px,97vw);margin:0 auto 18px;background:#fff;border:3px solid var(--line);border-radius:22px;padding:12px}.empty{padding:28px;text-align:center;color:var(--muted);font-weight:800}.lane{display:grid;grid-template-columns:155px 1fr;margin:9px 0}.lane.hidden{display:none}.label{min-height:150px;border:2px solid #8d7762;border-right:0;border-radius:16px 0 0 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:4px}.ico{font-size:42px}.nm{font-size:20px;font-weight:900}.phraseSample{font-size:12px;text-align:center;font-weight:800}.editLane{padding:5px 8px;min-height:34px;font-size:13px}.offset{display:grid;grid-template-columns:auto 1fr 58px;align-items:center;gap:5px;width:100%;font-size:11px}.offset input{width:100%}.track{position:relative;height:150px;overflow:hidden;border:2px solid #8d7762;border-radius:0 16px 16px 0;background:repeating-linear-gradient(to right,#fff 0,#fff calc(12.5% - 1px),#eee5da calc(12.5% - 1px),#eee5da 12.5%);touch-action:pan-y}.track.editing{box-shadow:inset 0 0 0 5px #ffd2b5}.target{position:absolute;left:105px;top:0;bottom:0;width:5px;background:var(--red);z-index:8}.target:before{content:"ここ！";position:absolute;top:4px;left:-22px;background:var(--red);color:#fff;border-radius:9px;padding:4px 7px;font-size:12px;font-weight:900}
.note{position:absolute;top:50%;width:132px;min-height:72px;border:4px solid #68584b;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;line-height:1.15;text-align:center;z-index:5;box-shadow:0 4px 8px #0002;user-select:none;padding:8px 10px;touch-action:none;white-space:normal;transform:translateY(-50%);transition:.06s}.note.current{border-color:var(--red);box-shadow:0 0 0 8px #ffe66a,0 0 18px 10px #ffd54a;transform:translateY(-50%) scale(1.1);z-index:7}
.note.taiko-hit,.note.taiko-rest{width:72px;height:72px;min-height:72px;border-radius:50%;font-size:16px;padding:4px}.note.taiko-hit.current,.note.taiko-rest.current{border-color:#68584b;box-shadow:0 4px 8px #0002;transform:translateY(-50%);background:#ef9a62!important}.note.taiko-rest{background:#fff!important;border-style:dashed;color:#777}.note.taiko-rest.current{background:#fff!important}.note.taiko-double{height:60px;min-height:60px;border:0;background:transparent!important;box-shadow:none;padding:0;overflow:visible}.miniHit{position:absolute;top:6px;width:48px;height:48px;border:4px solid #68584b;border-radius:50%;background:#ef9a62;display:grid;place-items:center;font-size:14px;font-weight:900;box-shadow:0 3px 6px #0002;transition:.06s}.miniHit.current{background:#fff36b!important;border-color:#d83b35;box-shadow:0 0 0 9px #ffe66a,0 0 22px 12px #ffd54a;transform:scale(1.18);z-index:3}
.note.bell-hit,.note.bell-rest{width:58px;height:58px;min-height:58px;border-radius:50%;padding:4px;font-size:12px}.note.bell-rest{background:#fff!important;border-style:dashed;color:#777}.note.bell-rest.current{border-color:#777;box-shadow:none;transform:translateY(-50%);background:#fff!important}.note.bell-hit.current{background:#fff36b!important;border-color:#d39b00;box-shadow:0 0 0 8px #fff0a5,0 0 22px 12px #ffd84a;transform:translateY(-50%) scale(1.16)}
.note.bell-long{width:190px;min-height:64px;border-radius:999px;background:linear-gradient(90deg,#fff7b0,#f3cf55,#fff4a0)!important;border-color:#c89200;overflow:visible;font-size:15px;letter-spacing:.03em}.note.bell-long:before,.note.bell-long:after{position:absolute;color:#fff8a6;text-shadow:0 0 8px #ffc400,0 0 12px #fff;animation:sparkle .8s ease-in-out infinite alternate}.note.bell-long:before{content:"✦ ✧ ✦";top:-17px;left:20px}.note.bell-long:after{content:"✧ ✦ ✧";bottom:-17px;right:18px;animation-delay:.25s}.note.bell-long.current{background:linear-gradient(90deg,#fffbd8,#fff36b,#fffbd8)!important;border-color:#d39b00;box-shadow:0 0 0 9px #fff0a5,0 0 30px 15px #ffd84a;transform:translateY(-50%) scale(1.08)}@keyframes sparkle{from{opacity:.45;transform:scale(.92)}to{opacity:1;transform:scale(1.12)}}
body.deleteMode .note{cursor:pointer;outline:6px solid #ffd2d2}
.performance{width:min(1180px,97vw);margin:8px auto 12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}.performance .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}.chooserBackdrop{position:fixed;inset:0;background:#0007;z-index:100;display:grid;place-items:center;padding:16px}.chooserBackdrop[hidden]{display:none}.chooser{width:min(700px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:20px;padding:18px}.instGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.instChoice{display:grid;place-items:center;gap:4px;padding:14px 8px}.instChoice span:first-child{font-size:34px}.instChoice.selected{background:#fff0df;border-color:var(--accent)}.chooserActions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.saveHint{text-align:center;color:var(--muted);font-size:13px;margin:10px}
body.single .lane:not(.hidden){grid-template-columns:190px 1fr}body.single .lane:not(.hidden) .label,body.single .lane:not(.hidden) .track{height:220px;min-height:220px}body.single .lane:not(.hidden) .target{left:140px}@media(max-width:760px){.lane{grid-template-columns:105px 1fr}.ico{font-size:31px}.nm{font-size:15px}.phraseSample{font-size:10px}.target{left:72px}.offset{grid-template-columns:1fr 48px}.offset b{grid-column:1/-1}body.single .lane:not(.hidden){grid-template-columns:120px 1fr}body.single .lane:not(.hidden) .target{left:90px}.note.bell-long{width:160px;font-size:13px}}
</style>
</head>
<body>
<header><h1>流れる絵譜</h1><div class="sub">曲を入れる → 楽器を選ぶ → すぐ演奏できます。</div></header>
<div class="controls"><label class="fileLabel primary">① 🎵 曲をえらぶ<input id="audioFile" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac"></label><button class="primary" id="instrumentBtn">② 🎺 楽器をえらぶ</button><button class="primary" id="playBtn" disabled>▶ 再生</button><button id="pauseBtn" disabled>⏸ 一時停止</button><button id="backBtn" disabled>↶ 5秒</button><button id="resetBtn" disabled>↺ 最初</button><button id="deleteBtn">🗑 削除</button><button id="restoreBtn">↩ 自動絵譜に戻す</button><button id="saveBtn">💾 保存</button><button id="loadBtn">📂 保存を読込</button><div class="group">表示<select id="modeSelect"><option value="all">全部</option></select></div><div class="group">曲の速さ<select id="rateSelect"><option value=".75">0.75倍</option><option value=".9">0.9倍</option><option value="1" selected>1.0倍</option><option value="1.1">1.1倍</option><option value="1.25">1.25倍</option><option value="1.5">1.5倍</option></select></div><div class="time"><span id="nowText">0:00</span> / <span id="durText">0:00</span></div></div>
<div class="tempoBox"><strong>絵譜の速さ</strong><button id="bpmMinus10">−10</button><button id="bpmMinus1">−1</button><input id="bpmInput" type="number" min="40" max="220" step="0.1" value="104.17"><strong>BPM</strong><button id="bpmPlus1">＋1</button><button id="bpmPlus10">＋10</button><span>｜</span><strong>開始</strong><button id="startEarlier">← 少し早く</button><button id="startLater">少し遅く →</button><button id="startReset">0に戻す</button></div>
<div class="audioBox"><div id="audioName" class="audioName">曲がまだ選ばれていません</div><audio id="audio" controls preload="metadata" playsinline webkit-playsinline></audio></div><div id="statusText" class="status">まず「① 曲をえらぶ」を押してください。</div><div class="tip">太鼓は「タタ」だけ光ります。鈴は1拍の中で「シャン・シャン・シャン・ウン」を丸で表示し、ときどき長い「✨シャララララー✨・ウン」が入ります。</div>
<section class="performance"><div class="row"><b>1つだけ大きく：</b><span id="performanceButtons"></span></div></section><section id="board" class="board"><div class="empty">曲と楽器を選ぶと、ここに絵譜が出ます。</div></section><div class="saveHint">保存すると、曲・選んだ楽器・絵譜・BPM・開始位置をこのブラウザーに保存します。</div>
<div id="chooserBackdrop" class="chooserBackdrop" hidden><div class="chooser"><h2>使う楽器を選ぶ</h2><p>使う楽器をタッチしてください。複数選べます。</p><div id="instGrid" class="instGrid"></div><div class="chooserActions"><button id="chooserCancel">キャンセル</button><button class="primary" id="chooserDone">これで決定</button></div></div></div>
<script>
'use strict';
const DB='flow-score-simple-v6',STORE='saved';
const INSTRUMENTS=[
{id:'taiko',name:'太鼓',icon:'🥁',color:'#ef9a62',phrase:'タン・タタ・タン・ウン',sequence:[{text:'タン',beat:0,kind:'hit'},{text:'タタ',beat:1,kind:'double'},{text:'タン',beat:2,kind:'hit'},{text:'ウン',beat:3,kind:'rest'}]},
{id:'bell',name:'鈴',icon:'🔔',color:'#f3cf55',phrase:'シャン・シャン・シャン・ウン／✨シャララララー・ウン'},
{id:'tamb',name:'タンバリン',icon:'⭕',color:'#7fc8b5',phrase:'シャラララーウン'},{id:'snare',name:'小太鼓',icon:'🥁',color:'#f0a878',phrase:'タンタカタン'},{id:'bass',name:'大太鼓',icon:'🪘',color:'#db8b62',phrase:'ドンウンドンウン'},{id:'cymbal',name:'シンバル',icon:'◉',color:'#f2d472',phrase:'ジャーンウン'},{id:'triangle',name:'トライアングル',icon:'△',color:'#dce9ee',phrase:'チンチンチンウン'},{id:'castanet',name:'カスタネット',icon:'◒',color:'#de8d72',phrase:'カッカカッウン'},{id:'maracas',name:'マラカス',icon:'🪇',color:'#a5d6a7',phrase:'シャカシャカシャカシャカ'},{id:'xylophone',name:'木琴',icon:'🎼',color:'#b9c9f5',phrase:'タンタンタンウン'},{id:'tonechime',name:'トーンチャイム',icon:'🔔',color:'#d8c6ef',phrase:'リーンウンウンウン'},{id:'recorder',name:'リコーダー',icon:'🪈',color:'#b8e0dc',phrase:'トゥトゥウントゥ'}];
const PX_PER_SEC=145,START_X=480;const state={selected:['taiko','bell','tamb'],lanes:{},editId:null,deleteMode:false,mode:'all',audioName:'',duration:0,bpm:104.1666667,startOffset:0};const $=id=>document.getElementById(id),audio=$('audio');const makeId=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2);const fmt=s=>!Number.isFinite(s)?'0:00':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');const inst=id=>INSTRUMENTS.find(x=>x.id===id);const beatSec=()=>60/Math.max(40,Math.min(220,Number(state.bpm)||104.1666667));
function autoNotes(id){const i=inst(id);if(!i)return[];const dur=Math.max(30,state.duration||180),out=[],bs=beatSec();if(id==='bell'){let beatIndex=0;for(let base=0;base<=dur+2;base+=bs,beatIndex++){const special=beatIndex>0&&beatIndex%8===7;if(special){out.push({id:makeId(),time:base,text:'✨ シャララララー ✨',kind:'bell-long'});const rt=base+bs*.75;if(rt<=dur+2)out.push({id:makeId(),time:rt,text:'ウン',kind:'bell-rest'});}else{[{f:0,text:'シャン',kind:'bell-hit'},{f:.25,text:'シャン',kind:'bell-hit'},{f:.5,text:'シャン',kind:'bell-hit'},{f:.75,text:'ウン',kind:'bell-rest'}].forEach(p=>{const time=base+bs*p.f;if(time<=dur+2)out.push({id:makeId(),time,text:p.text,kind:p.kind});});}}return out}if(i.sequence){for(let base=0;base<=dur+2;base+=4*bs)for(const p of i.sequence){const time=base+p.beat*bs;if(time<=dur+2)out.push({id:makeId(),time,text:p.text,kind:p.kind});}}else for(let t=0;t<=dur+2;t+=bs)out.push({id:makeId(),time:t,text:i.phrase,kind:'phrase'});return out}
function ensureLane(id){if(!state.lanes[id])state.lanes[id]={offset:0,notes:autoNotes(id)}}function rebuildAuto(){state.selected.forEach(id=>state.lanes[id]={offset:state.lanes[id]?.offset||0,notes:autoNotes(id)});renderBoard();saveState(false)}function setAudioReady(ok){['playBtn','pauseBtn','backBtn','resetBtn'].forEach(id=>$(id).disabled=!ok)}
function renderChooser(){const g=$('instGrid');g.innerHTML='';INSTRUMENTS.forEach(i=>{const b=document.createElement('button');b.className='instChoice'+(state.selected.includes(i.id)?' selected':'');b.innerHTML='<span>'+i.icon+'</span><b>'+i.name+'</b><small>'+i.phrase+'</small>';b.onclick=()=>{const n=state.selected.indexOf(i.id);n>=0?state.selected.splice(n,1):state.selected.push(i.id);renderChooser()};g.appendChild(b)})}
function renderModeOptions(){const s=$('modeSelect'),old=s.value;s.innerHTML='<option value="all">全部</option>';state.selected.forEach(id=>{const i=inst(id),o=document.createElement('option');o.value=id;o.textContent=i.icon+' '+i.name+'だけ';s.appendChild(o)});s.value=[...s.options].some(o=>o.value===old)?old:'all';state.mode=s.value}
function renderPerformanceButtons(){const r=$('performanceButtons');r.innerHTML='';state.selected.forEach(id=>{const i=inst(id),b=document.createElement('button');b.textContent=i.icon+' '+i.name;b.onclick=()=>{$('modeSelect').value=id;state.mode=id;renderVisibility()};r.appendChild(b)})}
function renderBoard(){const board=$('board');board.innerHTML='';if(!state.selected.length){board.innerHTML='<div class="empty">楽器を1つ以上選んでください。</div>';return}state.selected.forEach(id=>{ensureLane(id);const i=inst(id),lane=state.lanes[id],el=document.createElement('div');el.className='lane';el.id='lane-'+id;el.innerHTML='<div class="label" style="background:'+i.color+'33"><div class="ico">'+i.icon+'</div><div class="nm">'+i.name+'</div><div class="phraseSample">'+i.phrase+'</div><button class="editLane">✋ 編集</button><div class="offset"><b>位置</b><input type="range" min="-4" max="4" step=".05" value="'+lane.offset+'"><output>'+lane.offset.toFixed(2)+'</output></div></div><div class="track"><div class="target"></div></div>';board.appendChild(el);const track=el.querySelector('.track');if(state.editId===id)track.classList.add('editing');lane.notes.forEach(n=>track.appendChild(noteEl(id,n,i.color)));el.querySelector('.editLane').onclick=()=>{state.editId=state.editId===id?null:id;renderBoard()};const rng=el.querySelector('input'),out=el.querySelector('output');rng.oninput=()=>{lane.offset=Number(rng.value);out.textContent=lane.offset.toFixed(2);updatePositions();saveState(false)}});renderModeOptions();renderPerformanceButtons();renderVisibility();updatePositions()}
function noteEl(id,n,color){const d=document.createElement('div');let cls='note';if(id==='taiko'){if(n.kind==='double')cls+=' taiko-double';else if(n.kind==='rest')cls+=' taiko-rest';else cls+=' taiko-hit'}if(id==='bell'){if(n.kind==='bell-hit')cls+=' bell-hit';else if(n.kind==='bell-rest')cls+=' bell-rest';else if(n.kind==='bell-long')cls+=' bell-long'}d.className=cls;d.dataset.note=n.id;d.dataset.lane=id;d.style.background=color;if(id==='taiko'&&n.kind==='double'){d.innerHTML='<span class="miniHit" data-mini="0">タ</span><span class="miniHit" data-mini="1">タ</span>';requestAnimationFrame(()=>{const hits=d.querySelectorAll('.miniHit');if(hits.length===2){const gap=Math.max(35,beatSec()*PX_PER_SEC/2);hits[0].style.left='0px';hits[1].style.left=gap+'px';d.style.width=(gap+48)+'px';}})}else d.textContent=n.text;d.onclick=e=>{e.stopPropagation();if(state.deleteMode){state.lanes[id].notes=state.lanes[id].notes.filter(x=>x.id!==n.id);renderBoard();saveState(false)}};return d}
function renderVisibility(){document.body.classList.toggle('single',state.mode!=='all');document.querySelectorAll('.lane').forEach(l=>l.classList.toggle('hidden',state.mode!=='all'&&l.id!=='lane-'+state.mode))}
function updatePositions(){const t=audio.currentTime||0;document.querySelectorAll('.note').forEach(d=>{const id=d.dataset.lane,n=state.lanes[id]?.notes.find(x=>x.id===d.dataset.note);if(!n)return;const off=(state.lanes[id].offset||0)+(state.startOffset||0),x=START_X+(n.time+off-t)*PX_PER_SEC;d.style.left=x+'px';const laneEl=d.closest('.lane'),target=laneEl?.querySelector('.target'),tr=target?.getBoundingClientRect();if(id==='taiko'&&n.kind==='double'){d.classList.remove('current');d.querySelectorAll('.miniHit').forEach(h=>{if(!tr)return h.classList.remove('current');const hr=h.getBoundingClientRect(),hc=(hr.left+hr.right)/2,tc=(tr.left+tr.right)/2;h.classList.toggle('current',Math.abs(hc-tc)<=Math.max(10,hr.width*.22));});return}const dr=d.getBoundingClientRect(),dc=(dr.left+dr.right)/2,tc=tr?(tr.left+tr.right)/2:0,active=!!tr&&Math.abs(dc-tc)<=Math.max(12,Math.min(28,dr.width*.18));if(id==='taiko'){d.classList.remove('current');return}d.classList.toggle('current',n.kind!=='rest'&&n.kind!=='bell-rest'&&active)})}
let raf=0;function tick(){updatePositions();raf=requestAnimationFrame(tick)}async function play(){if(!audio.src)return;$('statusText').textContent='再生中です。';await audio.play();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}function pause(){audio.pause();cancelAnimationFrame(raf);updatePositions()}function reset(){audio.currentTime=0;updatePositions()}function back(){audio.currentTime=Math.max(0,(audio.currentTime||0)-5);updatePositions()}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function dbPut(v){const d=await openDB();return new Promise((res,rej)=>{const tx=d.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,'app');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function dbGet(){const d=await openDB();return new Promise((res,rej)=>{const r=d.transaction(STORE).objectStore(STORE).get('app');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function saveState(show=true){try{await dbPut({selected:state.selected,lanes:state.lanes,mode:state.mode,rate:audio.playbackRate,audioName:state.audioName,audioBlob:audio._blob||null,duration:state.duration,bpm:state.bpm,startOffset:state.startOffset});if(show)$('statusText').textContent='保存しました。'}catch(e){if(show)$('statusText').textContent='保存できませんでした。'}}function installAudioBlob(blob,name){if(!blob)return;audio._blob=blob;if(audio._url)URL.revokeObjectURL(audio._url);audio._url=URL.createObjectURL(blob);audio.src=audio._url;audio.load();state.audioName=name||blob.name||'選んだ曲';$('audioName').textContent='🎵 '+state.audioName;setAudioReady(true)}
async function loadState(){try{const v=await dbGet();if(!v)return;state.selected=v.selected||[];state.lanes=v.lanes||{};state.mode=v.mode||'all';state.duration=v.duration||0;state.bpm=Number(v.bpm)||104.1666667;state.startOffset=Number(v.startOffset)||0;$('bpmInput').value=state.bpm.toFixed(2);audio.playbackRate=v.rate||1;$('rateSelect').value=String(audio.playbackRate);if(v.audioBlob)installAudioBlob(v.audioBlob,v.audioName);renderBoard()}catch(e){}}
$('audioFile').onchange=e=>{const f=e.target.files?.[0];if(f)installAudioBlob(f,f.name)};audio.onloadedmetadata=()=>{state.duration=audio.duration||0;rebuildAuto();setAudioReady(true)};audio.ontimeupdate=updatePositions;$('instrumentBtn').onclick=()=>{renderChooser();$('chooserBackdrop').hidden=false};$('chooserCancel').onclick=()=>$('chooserBackdrop').hidden=true;$('chooserDone').onclick=()=>{$('chooserBackdrop').hidden=true;state.selected.forEach(ensureLane);renderBoard()};$('playBtn').onclick=play;$('pauseBtn').onclick=pause;$('backBtn').onclick=back;$('resetBtn').onclick=reset;$('deleteBtn').onclick=()=>{state.deleteMode=!state.deleteMode;document.body.classList.toggle('deleteMode',state.deleteMode)};$('restoreBtn').onclick=rebuildAuto;$('saveBtn').onclick=()=>saveState(true);$('loadBtn').onclick=loadState;$('modeSelect').onchange=e=>{state.mode=e.target.value;renderVisibility()};$('rateSelect').onchange=e=>{audio.playbackRate=Number(e.target.value)};$('bpmMinus10').onclick=()=>setBpm(state.bpm-10);$('bpmMinus1').onclick=()=>setBpm(state.bpm-1);$('bpmPlus1').onclick=()=>setBpm(state.bpm+1);$('bpmPlus10').onclick=()=>setBpm(state.bpm+10);$('bpmInput').onchange=e=>setBpm(e.target.value);function setBpm(v){state.bpm=Math.max(40,Math.min(220,Number(v)||104.1666667));$('bpmInput').value=state.bpm.toFixed(2);rebuildAuto()}$('startEarlier').onclick=()=>{state.startOffset-=.1;updatePositions()};$('startLater').onclick=()=>{state.startOffset+=.1;updatePositions()};$('startReset').onclick=()=>{state.startOffset=0;updatePositions()};renderBoard();setAudioReady(false);$('bpmInput').value=state.bpm.toFixed(2);
</script>
